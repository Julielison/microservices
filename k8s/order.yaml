apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: microservices
  labels:
    service: order
spec:
  # NodePort expõe o serviço Order para testes externos via kubectl port-forward
  type: ClusterIP
  selector:
    service: order
  ports:
    - name: grpc
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: microservices
  labels:
    service: order
spec:
  replicas: 1
  selector:
    matchLabels:
      service: order
  template:
    metadata:
      labels:
        service: order
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.28
          command:
            - sh
            - -c
            - "until nslookup mysql.microservices.svc.cluster.local; do echo waiting for mysql; sleep 5; done"
      containers:
        - name: order
          image: order:latest            # substitua pelo seu registry, ex: docker.io/user/order:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENV
              value: "production"
            - name: APPLICATION_PORT
              value: "3000"
            - name: DATA_SOURCE_URL
              value: "root:postgres@tcp(mysql:3306)/order?charset=utf8mb4&parseTime=True&loc=Local"
            - name: PAYMENT_SERVICE_URL
              value: "payment:8081"
            - name: SHIPPING_SERVICE_URL
              value: "shipping:8082"
          ports:
            - containerPort: 3000
