apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: microservices
  labels:
    service: payment
spec:
  clusterIP: None
  selector:
    service: payment
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: microservices
  labels:
    service: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
  template:
    metadata:
      labels:
        service: payment
    spec:
      initContainers:
        - name: wait-mysql
          image: busybox:1.28
          command:
            - sh
            - -c
            - "until nslookup mysql.microservices.svc.cluster.local; do echo waiting for mysql; sleep 5; done"
      containers:
        - name: payment
          image: payment:latest          # substitua pelo seu registry, ex: docker.io/user/payment:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENV
              value: "production"
            - name: APPLICATION_PORT
              value: "8081"
            - name: DATA_SOURCE_URL
              value: "root:postgres@tcp(mysql:3306)/payment?charset=utf8mb4&parseTime=True&loc=Local"
          ports:
            - containerPort: 8081
